<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness AI Chatbot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="screen-login" class="screen active">
    <div class="login-container">
      <div class="login-header">
        <h1>🏋️ Fitness AI</h1>
        <p>Your personal health & nutrition assistant</p>
      </div>

      <div class="auth-form" id="auth-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" maxlength="40">
        <input type="password" id="login-password" placeholder="Password (min 4 chars)" autocomplete="current-password" maxlength="128">
        <button class="btn-primary" id="btn-login">Sign In / Register</button>
        <p style="font-size:0.8rem;color:var(--text-muted);text-align:center;margin-top:0.25rem">
          New here? Just enter a username &amp; password to create your account.
        </p>
        <div class="error-msg" id="login-error"></div>
      </div>
    </div>
  </div>

  <!-- ============ ONBOARDING WIZARD ============ -->
  <div class="modal hidden" id="modal-onboard">
    <div class="modal-content" style="max-width:480px">
      <div class="modal-header">
        <h3 id="onboard-title">👋 Welcome! Let's set up your profile</h3>
      </div>
      <div class="modal-body" id="onboard-body">
        <!-- steps rendered by JS -->
      </div>
    </div>
  </div>

  <!-- ============ CHAT SCREEN ============ -->
  <div id="screen-chat" class="screen">
    <!-- Top Bar -->
    <header class="chat-header">
      <div class="header-left">
        <h2>Fitness AI</h2>
        <div class="user-badge" id="user-badge"></div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-summary" title="Daily Summary">&#x1F4CA;</button>
        <button class="btn-icon" id="btn-profile" title="Profile">&#x1F464;</button>
        <button class="btn-icon" id="btn-logout" title="Log out" style="font-size:0.85rem">&#x1F6AA;</button>
      </div>
    </header>

    <!-- Messages Area -->
    <main class="chat-messages" id="chat-messages"></main>

    <!-- Input Area -->
    <footer class="chat-input-area">
      <div class="input-row">
        <button class="btn-voice" id="btn-voice" title="Hold to speak">&#x1F3A4;</button>
        <input type="text" id="chat-input" placeholder="Type in any Indian language..." autocomplete="off">
        <button class="btn-send" id="btn-send" title="Send">&#x27A4;</button>
      </div>
      <div class="voice-indicator hidden" id="voice-indicator">
        <span class="pulse"></span> Recording... click mic to stop
      </div>
    </footer>

    <!-- Summary Modal -->
    <div class="modal hidden" id="modal-summary">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Daily Summary</h3>
          <button class="btn-close" id="close-summary">&times;</button>
        </div>
        <div class="modal-body" id="summary-body"></div>
      </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal hidden" id="modal-profile">
      <div class="modal-content">
        <div class="modal-header">
          <h3>My Profile</h3>
          <button class="btn-close" id="close-profile">&times;</button>
        </div>
        <div class="modal-body" id="profile-body"></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
